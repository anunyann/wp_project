<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
            crossorigin="anonymous"></script>
    <title>Add Professor</title>
</head>
<body>
<div class="container">

    <form method="POST" th:action="@{/professor/add-professor}">


                <label for="name" th:text="#{PROFESSOR_NAME}"></label>
                <input class="form-control" name="name" id="name" required="required"
                th:value="${professor?.name}">


                <label  for="id" th:text="#{ID}"></label>
                <input class="form-control" name="id" id="id" required="required"
                       th:value="${professor?.id}">



                <label for="dateOfBirth" th:text="#{DATE_OF_BIRTH}"></label>
                <input class="form-control" type="date" id="dateOfBirth" name="dateOfBirth" required="required"
                       th:value="${professorDetails?.birthDay}"
                />



                <label for="email" th:text="#{PROFESSOR_EMAIL}">Е-маил</label>
                <input class="form-control" name="email" id="email" required="required"
                       th:value="${professor?.email}">



                <label  for="title" th:text="#{DEGREE_TITLE}"></label>
                <select name="title" class="form-control" id="title">
                    <option
                            th:each="title : ${professorTitles}"
                            th:value="${title}"
                            th:text="${title}">
                    </option>
                </select>


                <label  for="degree" th:text="#{EDUCATION_DEGREE}"></label>
                <select name="degree" class="form-control" id="degree">
                    <option
                            th:each="degree : ${educationDegrees}"
                            th:value="${degree}"
                            th:text="${degree}"
                            th:selected="${professorDetails!=null ? professorDetails.getDegree().equals(degree):false}">
                    </option>
                </select>


            <button type="submit" class="btn btn-primary " th:text="#{SUBMIT}"></button>
         </form>
</div>
</body>
</html>
