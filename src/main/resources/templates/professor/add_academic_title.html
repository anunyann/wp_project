<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Add Academic Title</title>
</head>
<body>

<div class="container">
  <form method="POST">
    <label for="id" th:text="${'id'}"></label>
    <input type="text" id="id" name="id" required="required"/>
    <br>
    <label for="institution" th:text="${'institution'}"></label>
    <input type="text" id="institution" name="institution" required="required"/>
    <br>
    <label for="title" th:text="${'title'}"></label>
    <select name="title" class="form-control" id="title">
      <option
              th:each="title : ${professorTitles}"
              th:value="${title}"
              th:text="${title}">
      </option>
    </select>
    <br>
    <label for="area" th:text="${'area'}"></label>
    <input type="text" id="area" name="area" required="required"/>
    <br>
    <label for="electionYear" th:text="${'election year'}"></label>
    <input type="number" id="electionYear" name="electionYear" required="required"/>
    <br>
    <label for="decisionDocumentNumber" th:text="${'Decision Document Number'}"></label>
    <input type="number" id="decisionDocumentNumber" name="decisionDocumentNumber" required="required"/>
    <br>
    <button type="submit" class="btn btn-primary col-12" th:text="#{SUBMIT}"></button>
  </form>
</div>
</body>
</html>
