<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Add Academic Title</title>
</head>
<body>

<div class="container">
  <form method="POST">
    <label for="institution" th:text="${'institution'}"></label>
    <input type="text" id="institution" name="institution" required="required" th:value="${academicTitle?.institution}"/>
    <br>
    <label for="title" th:text="${'title'}"></label>
    <select name="title" class="form-control" id="title">
      <option
              th:each="title : ${professorTitles}"
              th:value="${title}"
              th:text="${title}"
              th:selected="${academicTitle!=null ? academicTitle.getTitle().equals(title):false}">
      </option>
    </select>
    <br>
    <label for="area" th:text="${'area'}"></label>
    <input type="text" id="area" name="area" required="required" th:value="${academicTitle?.area}"/>
    <br>
    <label for="electionYear" th:text="${'election year'}"></label>
    <input type="number" id="electionYear" name="electionYear" required="required" th:value="${academicTitle?.electionYear}"/>
    <br>
    <label for="decisionDocumentNumber" th:text="${'Decision Document Number'}"></label>
    <input type="number" id="decisionDocumentNumber" name="decisionDocumentNumber" required="required" th:value="${academicTitle?.decisionDocumentNumber}"/>
    <br>

    <button type="submit" class="btn btn-primary col-12" th:text="#{SUBMIT}"></button>
  </form>
</div>
</body>
</html>
