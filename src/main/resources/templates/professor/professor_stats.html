<html lang="en" layout:decorate="~{layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">
<meta charset="utf-8"/>
<head>
    <meta charset="UTF-8"/>
    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" rel="stylesheet">
    <script crossorigin="anonymous"
            integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script th:inline="javascript">
        function cleanQueryFilters() {
            window.location = "?";
        }

    </script>
</head>
<body>
<div class="view-content my-5" layout:fragment="content">
    <h3 th:text="#{PROFESSOR_STATS}"></h3>

    <div id="filters">
        <form method="GET" th:action="@{/admin/professor/professor-stats}">
            <div class="d-flex flex-wrap justify-content-between">

                <div class="col-md-3 col-sm-6 p-1">
                    <label class="mr-2 mb-0" for="nameSearch" th:text="#{SEARCH_BY_NAME}"></label>
                    <input class="form-control"
                           id="nameSearch"
                           name="nameSearch"
                           th:placeholder="#{SEARCH}"
                           th:value="${nameSearch}"
                           type="text"/>
                </div>

                <div class="col-md-3 col-sm-6 p-1">
                    <label class="mr-2 mb-0" for="emailSearch" th:text="#{SEARCH_BY_EMAIL}"></label>
                    <input class="form-control"
                           id="emailSearch"
                           name="emailSearch"
                           th:placeholder="#{SEARCH}"
                           th:value="${emailSearch}"
                           type="text"/>
                </div>

                <div class="col-md-3 col-sm-6  p-1">
                    <label class="mr-2 mb-0" for="titleFilter" th:text="#{FILTER_BY_TITLE}"></label>
                    <select class="form-control custom-select"
                            id="titleFilter"
                            name="titleFilter">
                        <option th:text="#{SELECT}" value=""></option>
                        <option th:each="title : ${professorTitles}"
                                th:selected="${titleFilter != null && title == titleFilter}"
                                th:text="${title}"
                                th:value="${title}">
                        </option>
                    </select>
                </div>

                <div class="col-md-3 col-sm-6  p-1">
                    <label class="mr-2 mb-0" for="semesterType" th:text="#{FILTER_BY_SEMESTER_TYPE}"></label>
                    <select class="form-control custom-select"
                            id="semesterType"
                            name="semesterSearch">
                        <option th:text="#{SELECT}" value=""></option>
                        <option th:each="semesterType : ${semesterTypes}"
                                th:selected="${semesterSearch != null && semesterType == semesterSearch}"
                                th:text="${semesterType}"
                                th:value="${semesterType}">
                        </option>
                    </select>
                </div>

                <div class="col-md-3 col-sm-6  p-1">
                    <label class="mr-2 mb-0" for="studyCycle" th:text="#{FILTER_BY_STUDY_CYCLE}"></label>
                    <select class="form-control custom-select"
                            id="studyCycle"
                            name="studyCycle">
                        <option th:text="#{SELECT}" value=""></option>
                        <option th:each="cycle : ${studyCycles}" th:text="${cycle}"
                                th:value="${cycle}"
                                th:selected="${selectedCycle != null && selectedCycle == cycle}">
                        </option>
                    </select>
                </div>

                <div class="col-md-3 col-sm-6  p-1">
                    <label class="mr-2 mb-0" for="accreditation" th:text="#{FILTER_BY_ACCREDITATION}"></label>
                    <select class="form-control custom-select"
                            id="accreditation"
                            name="accreditation">
                        <option th:text="#{SELECT}" value=""></option>
                        <option th:each="accreditation : ${accreditations}" th:text="${accreditation.getYear()}"
                                th:value="${accreditation.getYear()}"
                                th:selected="${selectedAccreditation != null ? selectedAccreditation == accreditation.getYear() : accreditation.getYear() == '2023'}">
                        </option>
                    </select>
                </div>

                <div class="col-md-6 col-sm-6  p-1 text-end">
                    <button
                            class="btn btn-primary col-3"
                            th:text="#{APPLY_FILTERS}"
                            type="submit"></button>
                    <button
                            class="btn btn-outline-dark col-3"
                            id="resetFiltersBtn"
                            th:onclick="cleanQueryFilters()"
                            th:text="#{RESET_FILTERS}"
                            type="reset"
                    ></button>
                </div>
            </div>
        </form>
    </div>

    <div class="item-list">
        <table class="table table-striped table-bordered">
            <thead>
            <tr>
                <th class="text-primary" th:text="#{PROFESSOR_NAME}"></th>
                <th class="text-primary" th:text="#{PROFESSOR_EMAIL}"></th>
                <th class="text-primary" th:text="#{PROFESSOR_TITLE}"></th>
                <th class="text-primary" th:text="#{STUDY_CYCLE}"></th>
                <th class="text-primary" th:text="#{SEMESTER_TYPE}"></th>
                <th class="text-primary" th:text="#{SUBJECT_COUNT}"></th>
                <th class="text-primary" th:text="#{SUBJECT_PARTS_COUNT}"></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="stat: ${statsPerProfessors.getContent()}">
                <td th:text="${stat.getProfessor().getName()}"></td>
                <td th:text="${stat.getProfessor().getEmail()}"></td>
                <td th:text="${stat.getProfessor().getTitle()}"></td>
                <td th:text="${stat.getCycle()}"></td>
                <td th:text="${stat.getSemester()}"></td>
                <td th:text="${stat.getNumSubjects()}"></td>
                <td th:text="${#numbers.formatDecimal(stat.getNumSubjectParts(), 1, 2)}"></td>
            </tr>
            </tbody>
        </table>
        <div th:include="fragments/paging :: pageSection(${statsPerProfessors})"></div>
    </div>
</div>
</body>
</html>
