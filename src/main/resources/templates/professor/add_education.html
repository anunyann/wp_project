<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
            crossorigin="anonymous"></script>
    <title>Add Professor</title>
</head>
<body>



<form method="POST" th:action="@{/professor/{professorId}/education(professorId=${professorId})}"  >

    <div class="container">
        <div class="row justify-content-start">
            <label class="col-2" for="educationDegree">Образование</label>
            <select name="degree" class="col-3" id="educationDegree">
                <option
                        th:each="degree : ${educationDegrees}"
                        th:value="${degree}"
                        th:text="${degree}"
                        th:selected="${education!=null ? education.getDegree().equals(degree):false}">
                </option>
            </select>
        </div>

        <div class="row justify-content-start">
            <label class="col-2" for="finishingYear">Година</label>
            <input class="col-3" name="finishingYear" id="finishingYear" required="required"
                   type="number" th:value="${education?.finishingYear}" >
        </div>

        <div class="row justify-content-start">
            <label class="col-2" for="institution">Институција</label>
            <input class="col-3" name="institution" id="institution"
                   required="required" th:value="${education?.institution}" >
        </div>

        <div class="row justify-content-start">
            <label class="col-2" for="discipline">Подрачје</label>
            <input class="col-3" name="discipline" id="discipline"
                   required="required" th:value="${education?.discipline}"  >
        </div>

        <div class="row justify-content-start">
            <label class="col-2" for="field">Поле</label>
            <input class="col-3" name="field" id="field"
                   required="required" th:value="${education?.field}"  >
        </div>

        <div class="row justify-content-start">
            <label class="col-2" for="area">Област</label>
            <input class="col-3" name="area" id="area"
                   required="required" th:value="${education?.area}" >
        </div>

        <button type="submit" class="btn btn-primary " th:text="#{SUBMIT}"></button>

    </div>

</form>

</body>
</html>
