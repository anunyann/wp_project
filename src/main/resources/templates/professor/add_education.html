<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
            crossorigin="anonymous"></script>
</head>
<body>
    <div class="container">
        <form method="POST" th:action="@{/professor/{professorId}/education(professorId=${professorId})}"  >
        <input type="hidden" name="educationId" th:value="${education?.getId()}" />

                <label  for="educationDegree" th:text="#{EDUCATION_DEGREE}"></label>
                <select name="degree" class="form-control" id="educationDegree">
                    <option
                            th:each="degree : ${educationDegrees}"
                            th:value="${degree}"
                            th:text="${degree}"
                            th:selected="${education!=null ? education.getDegree().equals(degree):false}">
                    </option>
                </select>

                <label  for="finishingYear" th:text="#{FINISHING_YEAR}"></label>
                <input class="form-control" name="finishingYear" id="finishingYear" required="required"
                       type="number" th:value="${education?.finishingYear}" >

                <label  for="institution" th:text="#{INSTITUTION}"></label>
                <input class="form-control" name="institution" id="institution"
                       required="required" th:value="${education?.institution}" >

                <label  for="discipline" th:text="#{DISCIPLINE}"></label>
                <input class="form-control" name="discipline" id="discipline"
                       required="required" th:value="${education?.discipline}"  >

                <label  for="field" th:text="#{FIELD}"></label>
                <input class="form-control" name="field" id="field"
                       required="required" th:value="${education?.field}"  >

                <label  for="area" th:text="#{AREA}"></label>
                <input class="form-control" name="area" id="area"
                       required="required" th:value="${education?.area}" >

            <button type="submit" class="btn btn-primary " th:text="#{SUBMIT}"></button>

    </form>
    </div>
</body>
</html>
