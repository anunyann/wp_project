<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Education</title>
</head>
<body>

<div class="container">
    <form method="POST">
        <label for="id" th:text="${'id'}"></label>
        <input type="text" id="id" name="id" required="required"/>
        <br>
        <label for="degree" th:text="${'degree'}"></label>
        <select name="degree" class="form-control" id="degree">
            <option
                    th:each="degree : ${educationDegrees}"
                    th:value="${degree}"
                    th:text="${degree}">
            </option>
        </select>
        <br>
        <label for="finishingYear" th:text="${'Finishing Year'}"></label>
        <input type="number" id="finishingYear" name="finishingYear" required="required"/>
        <br>
        <label for="institution" th:text="${'institution'}"></label>
        <input type="text" id="institution" name="institution" required="required"/>
        <br>
        <label for="discipline" th:text="${'discipline'}"></label>
        <input type="text" id="discipline" name="discipline" required="required"/>
        <br>
        <label for="field" th:text="${'field'}"></label>
        <input type="text" id="field" name="field" required="required"/>
        <br>
        <label for="area" th:text="${'area'}"></label>
        <input type="text" id="area" name="area" required="required"/>
        <br>


        <button type="submit" class="btn btn-primary col-12" th:text="#{SUBMIT}"></button>
    </form>
</div>
</body>
</html>
