<html lang="en" xmlns:th="http://www.thymeleaf.org">
<meta charset="utf-8"/>
<head>
    <meta charset="UTF-8"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
            crossorigin="anonymous"></script>
</head>
<body>

<div class="container">
    <div class="row justify-content-center" >
        <div class="col" th:text="Име"></div>
        <div class="col" th:text="Е-маил"></div>
        <div class="col" th:text="Звање"></div>
        <div class="col">
            <a th:href="@{'/professor/add-professor'}"
               class="btn btn-sm btn-primary">Додади професор</a>
        </div>
    </div>
    <div class="row justify-content-center" th:each="professor: ${professors}">
        <a class="col-9 text-decoration-none text-reset" th:href="@{'/professor/{id}' (id=${professor.getId()})}" >
            <div class="row justify-content-around">
                <div class="col-4"  th:text="${professor.getName()}"></div>
                <div class="col-4" th:text="${professor.getEmail()}"></div>
                <div class="col-4" th:text="${professor.getTitle()}"></div>
            </div>

        </a>
        <div class="col-3 d-flex">
            <a th:href="@{'/professor/{id}/delete' (id=${professor.getId()})}"
               class="btn btn-sm btn-danger m-1">Избриши

            </a>
            <a th:href="@{'/professor/{id}/edit' (id=${professor.getId()})}"
               class="btn btn-sm btn-info">Измени</a>
        </div>
    </div>
</div>

</body>
</html>
