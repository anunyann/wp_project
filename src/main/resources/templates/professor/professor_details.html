<html lang="en" layout:decorate="~{layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
</head>
<body class="bg-light">
<h3 th:text="#{PROFESSOR_DETAILS}"></h3>
<div class="container" layout:fragment="content">
    <div class="d-flex flex-wrap justify-content-between">
        <div class=" col-6 form-group p-1">
            <label for="name" th:text="#{PROFESSOR_NAME}"></label>
            <input class="form-control" id="name" name="name" th:value="${professor?.name}">
        </div>

        <div class=" col-6 form-group p-1">
            <label for="email" th:text="#{PROFESSOR_EMAIL}"></label>
            <input class="form-control" id="email" name="email" th:value="${professor?.email}">
        </div>
        <div class=" col-6 form-group p-1">
            <label for="title" th:text="#{PROFESSOR_TITLE}"></label>
            <input class="form-control" id="title" name="title" th:value="${professor?.title}">
        </div>
        <div class=" col-6 form-group p-1">
            <label for="birthDay" th:text="#{DATE_OF_BIRTH}"></label>
            <input class="form-control" id="birthDay" name="birthDay" th:value="${professorDetails?.birthDay}">
        </div>
        <div class=" col-6 form-group p-1">
            <label for="degree" th:text="#{EDUCATION_DEGREE}"></label>
            <input class="form-control" id="degree" name="degree" th:value="${professorDetails?.degree}">
        </div>
    </div>

    <div class="d-flex container justify-content-evenly" style="margin-top: 50px">
        <h4 class="text-center" th:text="#{ACADEMIC_TITLE}"></h4>
        <div>
            <a class="text-decoration-none text-reset d-inline-block btn btn-sm btn-primary"
               th:href="@{'/admin/professor/{id}/titles' (id=${professor.getId()})}"
               th:text="${academicTitle== null ? 'Додади': 'Измени'}"
               th:if="${professor.getName()!=null && professor.getEmail()!=null && professor.getTitle()!=null && professorDetails != null  }"
            ></a>
            <a class="text-decoration-none text-reset d-inline-block btn btn-sm btn-danger"
               th:href="@{'/admin/professor/{professorId}/titles/{titleId}/delete'(professorId=${professor.getId()}, titleId=${academicTitle?.getId()})}"
               th:if="${academicTitle!= null}" th:text="#{DELETE}"></a>

        </div>
    </div>

    <div class="item-list" th:if="${academicTitle != null}">
        <table class="table table-bordered">
            <thead>
            <tr>
                <th class="text-primary" th:text="#{INSTITUTION}"></th>
                <th class="text-primary" th:text="#{TITLE}"></th>
                <th class="text-primary" th:text="#{AREA}"></th>
                <th class="text-primary" th:text="#{ELECTION_YEAR}"></th>
                <th class="text-primary" th:text="#{DECISION_DOCUMENT_NUMBER}"></th>

            </tr>
            </thead>
            <tbody>
            <tr>
                <td th:text="${academicTitle?.institution}"></td>
                <td th:text="${academicTitle?.title}"></td>
                <td th:text="${academicTitle?.area}"></td>
                <td th:text="${academicTitle?.electionYear}"></td>
                <td th:text="${academicTitle?.decisionDocumentNumber}"></td>
            </tr>
            </tbody>
        </table>

    </div>
    <div class="d-flex container justify-content-evenly mt-5 mb-2">
        <h4 class="text-center">Образование</h4>
        <form th:action="@{'/admin/professor/{id}/education/add' (id=${professor.getId()})}"
              method="get">
            <button class="btn btn-md btn-primary" type="submit" title="Додади"
                    th:if="${professor.getName()!=null && professor.getEmail()!=null && professor.getTitle()!=null && professorDetails != null  }"
            >
                <i class="fas fa-plus"></i>
            </button>
        </form>
    </div>

    <div class="item-list">
        <table class="table table-striped table-bordered">
            <thead>
            <tr>
                <th class="text-primary" th:text="#{EDUCATION}"></th>
                <th class="text-primary" th:text="#{YEAR}"></th>
                <th class="text-primary" th:text="#{INSTITUTION}"></th>
                <th class="text-primary" th:text="#{DISCIPLINE}"></th>
                <th class="text-primary" th:text="#{FIELD}"></th>
                <th class="text-primary" th:text="#{AREA}"></th>
                <th class="text-primary"></th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${educations== null || educations.isEmpty()}">
                <td class="text-center" colspan="7" th:text="#{NO_DATA}">

                </td>
            </tr>
            <tr th:each="education: ${educations}">
                <td th:text="${education.getEducation().getDegree()}"></td>
                <td th:text="${education.getEducation().getFinishingYear()}"></td>
                <td th:text="${education.getEducation().getInstitution()}"></td>
                <td th:text="${education.getEducation().getDiscipline()}"></td>
                <td th:text="${education.getEducation().getField()}"></td>
                <td th:text="${education.getEducation().getArea()}"></td>
                <td class="d-flex flex-wrap">
                    <div class="col-3">
                        <a class="btn btn-sm btn-warning m-1"
                           th:href="@{'/admin/professor/{professorId}/education/{educationId}/edit'
                (professorId=${professor.getId()}, educationId=${education.getEducation().getId()})}">
                            <i th:text="#{EDIT}"></i>
                        </a>
                    </div>
                    <div class="col-3">
                        <a class="btn btn-sm btn-danger m-1"
                           th:href="@{'/admin/professor/{professorId}/education/{educationId}/delete'
                (professorId=${professor.getId()}, educationId=${education.getEducation().getId()})}">
                            <i th:text="#{DELETE}"></i>
                        </a>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
