<html lang="en" xmlns:th="http://www.thymeleaf.org">
<meta charset="utf-8"/>
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${studyProgram?.studyProgram.name}"></title>
  <!--    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"-->
  <!--          integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">-->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
        crossorigin="anonymous" referrerpolicy="no-referrer"/>

</head>
<body>

<div>
  <h2>
    <span th:text="${studyProgram?.studyProgram.name}"></span> (<span th:text="${studyProgram?.durationYears}"/>
    годишни)
    <a name="top"></a>
    <hr/>
  </h2>
  <div class="col-12">
    <h3>Општи информации</h3>
    <p class="ms-4" th:text="${studyProgram?.generalInformation}"></p>
  </div>
  <div class="col-12">
    <h3>Стекната титула по завршување на студиската програма</h3>

    <div class="col-12 ms-4">
      <h5 th:text="${studyProgram?.graduationTitle}"></h5>
    </div>
    <div class="col-12 ms-4">
      <h5 th:text="${studyProgram?.graduationTitleEn}"></h5>
    </div>
  </div>
  <div class="col-12">
    <h3>Наставна програма</h3>
    <p class="ms-4" th:text="${studyProgram?.subjectRestrictions}" style="white-space: pre-line"></p>
  </div>
  <div class="col-12">
    <h4>Предмети</h4>
    <span th:each="sem: ${bySemesterAndMandatory}">
            <a th:href='${"#sem-"+sem.getKey()}'>
                Семестар: <span th:text="${sem.getKey()}"></span>
            </a>
        </span>
  </div>
  <div th:each="sem: ${bySemesterAndMandatory}" class="row">
    <div class="col-12">
      <a th:href='${"#top"}' style="float:right"><i class="fa fa-arrow-up">
      </i></a>
      <h3>
        Семестар: <span th:text="${sem.getKey()}"></span>
        <a th:id='${"sem-"+sem.getKey()}'></a>
      </h3>


      <table class="table table-striped table table-bordered table-sm">
        <tr>
          <td colspan="3">
            <h4>Задолжителни предмети</h4>
          </td>
        </tr>
        <tr>
          <th width="16%">
            Код
          </th>
          <th width="16%">
            Предмет
          </th>
          <th width="16%">
            Кредити
          </th>
          <th width="16%">
            Студиска програма
          </th>
          <th width="16%">
            Семестар
          </th>
          <th width="16%">
            Предметна група
          </th>
          <th>

          </th>
          <!--                    <th width="40%">-->
          <!--                        Предуслови-->
          <!--                    </th>-->
        </tr>
        <tr th:each="s: ${sem.getValue().get(true)}">
          <td th:text="${s.subject.id}">
          </td>
          <td>
            <a th:if="${!s.subject.placeholder}" th:href="@{/subject/{id}(id=${s.subject.id})}" th:text="${s.subject.subject.name}"></a>
            <span th:if="${s.subject.placeholder}" th:text="${s.subject.subject.name}"></span>
          </td>
          <td th:text="${s.subject.credits}">
            6.00
          </td>
          <!--                    <td th:text="${s.subject.dependencies?.getDependencies()}">-->
          <!--                    </td>-->
          <td>
            <label>
              <select th:field="${s.studyProgram}">
                <option th:each="program:${@displayServiceImpl.getSubjectPrograms(${s.getId()})}"
                        th:value="${program}"
                        th:text="${program.toString()}"
                ></option>
              </select>
            </label>
          </td>
          <td>
            <label>
              <input th:field="${s.semester}" type="text">
            </label>
          </td>
          <td>
          </td>
          <td>
            <button type="submit">Save</button>
          </td>
        </tr>
        <tr th:if="${sem.getValue().get(false)!=null && !sem.getValue().get(false).isEmpty()}">
          <td colspan="3">
            <h4>Изборни предмети</h4>
          </td>
        </tr>
        <tr th:if="${sem.getValue().get(false)!=null && !sem.getValue().get(false).isEmpty()}">
          <th width="10%">
            Код
          </th>
          <th>
            Предмет
          </th>
          <th>
            Кредити
          </th>
          <!--                    <th>-->
          <!--                        Предуслови-->
          <!--                    </th>-->
        </tr>
        <tr th:each="s: ${sem.getValue().get(false)}"
            th:if="${sem.getValue().get(false)!=null && !sem.getValue().get(false).isEmpty()}">
          <td th:text="${s.subject.id}">
          </td>
          <td>
            <a th:href="@{/subject/{id}(id=${s.subject.id})}" th:text="${s.subject.subject.name}"></a>
          </td>
          <td th:text="${s.subject.credits}">
            6.00
          </td>
          <!--                    <td th:text="${s.subject.dependencies?.getDependencies()}">-->

          <!--                    </td>-->
        </tr>
      </table>
    </div>
  </div>
</div>
</body>
</html>
