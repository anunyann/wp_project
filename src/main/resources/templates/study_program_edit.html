<html lang="en" xmlns:th="http://www.thymeleaf.org">
<meta charset="utf-8"/>
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${studyProgram?.studyProgram.name}"></title>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
            integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
        crossorigin="anonymous" referrerpolicy="no-referrer"/>

</head>
<body>

<div>
  <h2>
    <span th:text="${studyProgram?.studyProgram.name}"></span> (<span th:text="${studyProgram?.durationYears}"/>
    годишни)
    <a name="top"></a>
    <hr/>
  </h2>
  <div class="col-12">
    <h3>Општи информации</h3>
    <p class="ms-4" th:text="${studyProgram?.generalInformation}"></p>
  </div>
  <div class="col-12">
    <h3>Стекната титула по завршување на студиската програма</h3>

    <div class="col-12 ms-4">
      <h5 th:text="${studyProgram?.graduationTitle}"></h5>
    </div>
    <div class="col-12 ms-4">
      <h5 th:text="${studyProgram?.graduationTitleEn}"></h5>
    </div>
  </div>
  <div class="col-12">
    <h3>Наставна програма</h3>
    <p class="ms-4" th:text="${studyProgram?.subjectRestrictions}" style="white-space: pre-line"></p>
  </div>
  <div class="col-12">
    <h4>Предмети</h4>
    <span th:each="sem: ${bySemesterAndMandatory}">
            <a th:href='${"#sem-"+sem.getKey()}'>
                Семестар: <span th:text="${sem.getKey()}"></span>
            </a>
        </span>
  </div>
  <div th:each="sem: ${bySemesterAndMandatory}" class="row">
    <div class="col-12">
      <a th:href='${"#top"}' style="float:right"><i class="fa fa-arrow-up">
      </i></a>
      <h3>
        Семестар: <span th:text="${sem.getKey()}"></span>
        <a th:id='${"sem-"+sem.getKey()}'></a>
      </h3>


      <table class="table table-striped table table-bordered table-sm">
        <tr>
          <td colspan="3">
            <h4>Задолжителни предмети</h4>
          </td>
        </tr>
        <tr>
          <th></th>
          <th>
            Код
          </th>
          <th>
            Предмет
          </th>
          <th>
            Кредити
          </th>
          <th>
            Студиска програма
          </th>
          <th>
            Семестар
          </th>
          <th>
            Предметна група
          </th>
          <th>
          </th>

          <!--                    <th width="40%">-->
          <!--                        Предуслови-->
          <!--                    </th>-->
        </tr>
        <tr th:each="s: ${sem.getValue().get(true)}">
          <!-- Копче за бришење на ред (предмет од семестар) -->
          <td style="white-space: nowrap;max-width:100%;">
            <label style="display: flex; align-items: center; justify-content: center; white-space: nowrap;">
              <button th:action="/program/${studyProgram}/delete/${s.subject.getId()}" style="display: flex; align-items: center; justify-content: center;">Х</button>
            </label>
          </td>

          <!-- Код на предметот -->
          <td>
            <label th:text="${s.subject.id}"></label>
          </td>

          <!-- Име на предметот -->
          <td>
            <a th:if="${!s.subject.placeholder}" th:href="@{/subject/{id}(id=${s.subject.id})}" th:text="${s.subject.subject.name}"></a>
            <span th:if="${s.subject.placeholder}" th:text="${s.subject.subject.name}"></span>
          </td>

          <!-- Број на кредити за предметот -->
          <td>
            <label th:text="${s.subject.credits}">
              <input type="number" th:field="${s.subject.credits}" form="edit-form">
            </label>
          </td>

          <!--                    <td th:text="${s.subject.dependencies?.getDependencies()}">-->
          <!--                    </td>-->

          <!-- Промена на студиска програма -->
          <td>
            <label>
              <select th:field="${s.studyProgram}" form="edit-form">
                <option th:each="program:${@displayServiceImpl.getSubjectPrograms(${s.getId()})}"
                        th:value="${program}"
                        th:text="${program.toString()}"
                ></option>
              </select>
            </label>
          </td>

          <!-- Семестар во кој се изучува предметот -->
          <td>
            <label>
              <input th:text="${s.semester.toString()}" th:field="${s.semester}" type="text" form="edit-form">
            </label>
          </td>

          <!-- Предметна група на која припаѓа предметот -->
          <td>
            <label>
              <input th:text="${s.subjectGroup.toString()}" th:field="${s.subjectGroup}" form="edit-form">
            </label>
          </td>

          <!-- Копче за зачувување на измени на предметот -->
          <td>
            <form id="edit-form" th:action="/program/${program}/edit-subjects" method="post">
            <button type="submit">Save</button>
            </form>
          </td>

        </tr>

        <!-- Изборни предмети -->

        <tr th:if="${sem.getValue().get(false)!=null && !sem.getValue().get(false).isEmpty()}">
          <td colspan="3">
            <h4>Изборни предмети</h4>
          </td>
        </tr>
        <tr th:if="${sem.getValue().get(false)!=null && !sem.getValue().get(false).isEmpty()}">
          <!-- Код на предметот -->
          <th width="10%">
            Код
          </th>

          <!-- Име на предметот -->
          <th>
            Предмет
          </th>
          <!-- Број на кредити за предметот -->
          <th>
            Кредити
          </th>
          <!--                    <th>-->
          <!--                        Предуслови-->
          <!--                    </th>-->
        </tr>
        <tr th:each="s: ${sem.getValue().get(false)}"
            th:if="${sem.getValue().get(false)!=null && !sem.getValue().get(false).isEmpty()}">
          <td th:text="${s.subject.id}">
          </td>
          <td>
            <a th:href="@{/subject/{id}(id=${s.subject.id})}" th:text="${s.subject.subject.name}"></a>
          </td>
          <td th:text="${s.subject.credits}">
            6.00
          </td>
          <!--                    <td th:text="${s.subject.dependencies?.getDependencies()}">-->

          <!--                    </td>-->
        </tr>
      </table>
    </div>
  </div>
</div>
</body>
</html>
