<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
>
<meta charset="utf-8"/>
<head>
    <meta charset="UTF-8"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
            crossorigin="anonymous"></script>

</head>
<body class="bg-light">
<div class="view-content my-5" layout:fragment="content">
    <h3 th:text="#{DOCUMENTS}"></h3>
    <div id="documentForm">
        <form th:action="@{'/admin/study-programs/{studyProgramId}/documents/add' (studyProgramId=${studyProgramId})}"
              enctype="multipart/form-data" method="POST">
            <div class="d-flex flex-wrap justify-content-between">
                <div class="col-md-3 col-sm-6 p-1">
                    <label for="name" class="mr-2 mb-0" th:text="#{DOCUMENT_NAME}"></label>
                    <input type="text"
                           id="name"
                           class="form-control"
                           name="name"/>
                </div>

                <div class="col-md-3 col-sm-6  p-1">
                    <label for="type" class="mr-2 mb-0" th:text="#{DOCUMENT_TYPE}"></label>
                    <select id="type"
                            class="form-control custom-select"
                            name="type"
                            required>
                        <option value="" th:text="#{SELECT}"></option>
                        <option th:each="type : ${accreditationDocumentTypes}"
                                th:value="${type}"
                                th:text="${type}">
                        </option>
                    </select>
                </div>

                <div class="col-md-3 col-sm-6  p-1">
                    <label for="file" th:text="#{DOCUMENT}"></label>
                    <input type="file" class="form-control" id="file" name="file" required>
                </div>

                <div class="col-md-12 col-sm-6 mt-3 p-1 text-end">
                    <button
                            type="submit"
                            class="btn btn-primary col-3"
                            th:text="#{SUBMIT}"></button>
                </div>
            </div>
        </form>
    </div>


    <div class="item-list mt-4">
        <table class="table table-striped table-bordered">
            <thead>
            <tr>
                <th class="text-primary" th:text="'#'"></th>
                <th class="text-primary" th:text="#{DOCUMENT_NAME}"></th>
                <th class="text-primary" th:text="#{DOCUMENT_TYPE}"></th>
                <th class="text-primary" th:text="#{CREATION_DATE}"></th>
                <th class="text-primary"></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="spAccDocument, start: ${studyProgramAccreditationDocuments}">
                <td th:text="${start.index + 1 }"></td>
                <td th:text="${spAccDocument.getName()}"/>
                </td>
                <td th:text="${spAccDocument.getType().name()}"></td>
                <td th:text="${#temporals.format(spAccDocument.creationDate, 'yyyy-MM-dd')}"></td>
                <td class="text-right d-flex flex-wrap justify-content-end">
                    <div class="col-5 me-2">
                        <a th:href="@{'/admin/study-programs/{studyProgramId}/documents/download/{id}' (studyProgramId=${studyProgramId}, id=${spAccDocument.getId()})}"
                           class="btn btn-sm btn-outline-dark m-1">
                            <i class="fa fa-trash" th:text="#{DOWNLOAD}"></i>
                        </a>
                    </div>

                    <div class="col-5 me-2">
                        <a th:href="@{'/admin/study-programs/{studyProgramId}/documents/delete/{id}' (studyProgramId=${studyProgramId}, id=${spAccDocument.getId()})}"
                           class="btn btn-sm btn-danger m-1">
                            <i class="fa fa-trash" th:text="#{DELETE}"></i>
                        </a>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
