<!DOCTYPE html>
<html lang="en"
      xmlns:layout="http://www.w3.org/1999/xhtml"
      layout:decorate="~{layout}">
<head>
    <title>Edit Books</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
              integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
</head>
<body>
<div class="container" layout:fragment="content">

<h1>Edit Books</h1>
<div class="table-responsive">
    <table class="table table-bordered">
        <thead>
        <tr>
            <th>Ред.бр.</th>
            <th>Автор</th>
            <th>Наслов</th>
            <th>Издавач</th>
            <th>Година</th>
        </tr>
        </thead>
        <tbody>

        <tr th:each="b, rowStat : ${books}">
            <td th:text="${rowStat.count}"></td>
            <td th:text="${b.author}"></td>
            <td th:text="${b.title}"></td>
            <td th:text="${b.publisher}"></td>
            <td th:text="${b.year}">2005</td>
            <td>
                <form th:action="@{/remove-book}" method="post">
                    <button type="submit" class="btn btn-danger">Remove</button>
                </form>
            </td>
        </tr>
        <tr>
            <td colspan="5" class="text-center"><strong>Add new book</strong></td>
        </tr>
        <tr>
            <td></td>
            <form th:action="@{'/add-new-elective-book/' + ${subjectId}}" method="post">
                <td><input type="text" class="form-control" th:field="${newBook.author}" placeholder="Author"></td>
            <td><input type="text" class="form-control" th:field="${newBook.title}" placeholder="Title"></td>
            <td><input type="text" class="form-control" th:field="${newBook.publisher}" placeholder="Publisher"></td>
            <td><input type="text" class="form-control" th:field="${newBook.year}" placeholder="Year"></td>
                <td>
                <td>  <button type="submit" class="btn btn-success">Add Book</button></td>
                </td>
            </form>

        </tr>
        </tbody>
    </table>
</div>
</div>

</body>
</html>
