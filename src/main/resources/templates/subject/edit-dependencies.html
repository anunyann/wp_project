<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>Edit Subject Dependencies</title>
</head>
<body>
<div class="container" layout:fragment="content">
    <h2>Edit Dependencies for Subject: <span th:text="${subject.name}"></span></h2>

    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Add New Dependency Form -->
    <div class="card mb-4">
        <div class="card-header">
            <h5 class="mb-0">Add New Dependency</h5>
        </div>
        <div class="card-body">
            <form th:action="@{/admin/subject/{subjectId}/add-dependency(subjectId=${subject.id})}" method="post">
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="studyProgramCode" class="form-label">Study Program Code (Optional)</label>
                        <input type="text" id="studyProgramCode" name="studyProgramCode" class="form-control">
                    </div>
                    <div class="col-md-6">
                        <label for="dependencyType" class="form-label">Dependency Type</label>
                        <select id="dependencyType" name="dependencyType" class="form-select" required>
                            <option value="">Select Dependency Type</option>
                            <option th:each="type : ${dependencyTypes}"
                                    th:value="${type}"
                                    th:text="${type}"></option>
                        </select>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-12">
                        <label for="dependency" class="form-label">Dependency</label>
                        <input type="text" id="dependency" name="dependency" class="form-control" required
                               placeholder="Subject code or description">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Add Dependency</button>
            </form>
        </div>
    </div>

    <!-- Existing Dependencies Table -->
    <div class="card">
        <div class="card-header">
            <h5 class="mb-0">Existing Dependencies</h5>
        </div>
        <div class="card-body">
            <table class="table table-striped">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Study Program Code</th>
                    <th>Dependency Type</th>
                    <th>Dependency</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="dep : ${dependencies}">
                    <td th:text="${dep.id}"></td>
                    <td th:text="${dep.studyProgramCode ?: 'All Programs'}"></td>
                    <td th:text="${dep.dependencyType}"></td>
                    <td th:text="${dep.dependency}"></td>
                    <td>
                        <button type="button" class="btn btn-sm btn-info" data-bs-toggle="modal"
                                th:data-bs-target="'#editModal-' + ${dep.id}">
                            Edit
                        </button>
                        <a th:href="@{/admin/subject/{subjectId}/delete-dependency/{dependencyId}(subjectId=${subject.id},dependencyId=${dep.id})}"
                           class="btn btn-sm btn-danger"
                           onclick="return confirm('Are you sure you want to delete this dependency?')">
                            Delete
                        </a>

                        <!-- Edit Modal -->
                        <div class="modal fade" th:id="'editModal-' + ${dep.id}" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
                            <div class="modal-dialog">
                                <div class="modal-content">
                                    <div class="modal-header">
                                        <h5 class="modal-title" id="editModalLabel">Edit Dependency</h5>
                                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                    </div>
                                    <div class="modal-body">
                                        <form th:action="@{/admin/subject/{subjectId}/update-dependency/{dependencyId}(subjectId=${subject.id},dependencyId=${dep.id})}" method="post">
                                            <div class="mb-3">
                                                <label for="editStudyProgramCode" class="form-label">Study Program Code</label>
                                                <input type="text" class="form-control" id="editStudyProgramCode" name="studyProgramCode"
                                                       th:value="${dep.studyProgramCode}">
                                            </div>
                                            <div class="mb-3">
                                                <label for="editDependencyType" class="form-label">Dependency Type</label>
                                                <select class="form-select" id="editDependencyType" name="dependencyType" required>
                                                    <option th:each="type : ${dependencyTypes}"
                                                            th:value="${type}"
                                                            th:text="${type}"
                                                            th:selected="${dep.dependencyType == type}"></option>
                                                </select>
                                            </div>
                                            <div class="mb-3">
                                                <label for="editDependency" class="form-label">Dependency</label>
                                                <input type="text" class="form-control" id="editDependency" name="dependency"
                                                       th:value="${dep.dependency}" required>
                                            </div>
                                            <button type="submit" class="btn btn-primary">Save changes</button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </td>
                </tr>
                <tr th:if="${dependencies.isEmpty()}">
                    <td colspan="5" class="text-center">No dependencies found</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="mt-3">
        <a th:href="@{/admin/subject/{id}/details(id=${subject.id})}" class="btn btn-secondary">Back to Subject Details</a>
    </div>
</div>
</body>
</html>
