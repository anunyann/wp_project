<div th:fragment="pageSection(page)">
    <div class="d-flex align-items-center mb-3">
        <label for="results" class="mr-2 mb-0" th:text="#{RESULTS_PER_PAGE}"></label>

        <select
                id="results"
                class="form-control custom-select"
                style="max-width: 100px"
                onchange="updateQueryStringParameter('results',this.value)"
        >
            <option value="10" th:selected="${page.size == 10}">10</option>
        </select>
    </div>

    <nav aria-label="Page navigation">
        <ul class="pagination">
            <li
                    class="cursor-pointer page-item"
                    th:class="${page.isFirst()} ? 'disabled' : ''"
            >
                <a
                        class="page-link"
                        href="#"
                        onClick="updateQueryStringParameter('pageNum', 1)"
                        th:text="#{FIRST}"
                ></a
                >
            </li>
            <li class="page-item" th:class="${page.hasPrevious()} ? '': 'disabled'">
                <a
                        class="page-link"
                        href="#"
                        onClick="updateQueryStringParameter('pageNum', this.getAttribute('page-number'))"
                        th:page-number="${page.number}"
                        th:text="#{PREVIOUS}"
                ></a
                >
            </li>
            <li th:each="pageNum : ${#numbers.sequence(
                (page.number > 5 ? page.number - 5 : 1),
                (page.totalPages > (page.number + 5) ? (page.number + 5) : page.totalPages))}"
                th:class="${page.number + 1 == pageNum} ? 'page-item active' : 'page-item'">
                <a class="page-link"
                   href="#"
                   onClick="updateQueryStringParameter('pageNum', this.getAttribute('page-number'))"
                   th:page-number="${pageNum}"
                   th:text="${pageNum}">
                </a>
            </li>
            <li class="page-item" th:class="${page.hasNext()} ? '': 'disabled'">
                <a
                        class="page-link"
                        href="#"
                        onClick="updateQueryStringParameter('pageNum', this.getAttribute('page-number'))"
                        th:page-number="${page.number+2}"
                        th:text="#{NEXT}"
                ></a
                >
            </li>
            <li class="page-item" th:class="${page.isLast()} ? 'disabled' : ''">
                <a
                        class="page-link"
                        href="#"
                        onClick="updateQueryStringParameter('pageNum', this.getAttribute('page-number'))"
                        th:page-number="${page.totalPages}"
                        th:text="#{LAST}"
                ></a
                >
            </li>
        </ul>
    </nav>

    <script th:inline="javascript">
        function updateQueryStringParameter(key, value) {
            var uri = window.location.href;
            var re = new RegExp("([?&])" + key + "=.*?(&|$)", "i");
            var separator = uri.indexOf("?") !== -1 ? "&" : "?";
            if (uri.match(re)) {
                uri = uri.replace(re, "$1" + key + "=" + value + "$2");
            } else {
                uri = uri + separator + key + "=" + value;
            }
            window.location = uri;
        }
    </script>
</div>
