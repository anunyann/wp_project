<!DOCTYPE html>
<html lang="en" layout:decorate="~{layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" rel="stylesheet">
  <script crossorigin="anonymous"
          integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
          src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div class="view-content my-5" layout:fragment="content">
  <h3 th:text="${staff.name}">Име на вработен</h3>
  <div class="card" style="width: 18rem;">
    <img th:src="@{/default.png}" class="card-img-top" alt="Staff Image"/>
    <div class="card-body">
      <h5 class="card-title" th:text="${staff.name}">Име</h5>
      <p class="card-text">
        <strong>Улога:</strong> <span th:text="${roleNames[staff.role]}">Улога</span><br/>
        <strong>Е-маил Адреса:</strong> <span th:text="${staff.email}">Е-маил адреса</span>
      </p>
      <a href="/staff" class="btn btn-primary">Назад кон сите вработени</a>
    </div>
  </div>
  <div th:if="${isProfessor}">
    <div class="card mt-4">
      <div class="card-body">
        <h5 class="card-title">Информации за професор:</h5>
        <p class="card-text">
          <strong>Титула:</strong> <span th:text="${professor.title}">Титула</span><br/>
          <strong>Академска Титула:</strong> <span th:if="${academicTitles != null}"
                                                   th:text="${academicTitles.academicTitle}">Академска Титула</span><span
                th:unless="${academicTitles != null}">Нема достапни информации</span><br/>
        <h5>Лични податоци:</h5>
        <ul>
          <li th:each="detail : ${professorDetails}" th:text="${detail.birthDay}"></li>
          <li th:each="detail : ${professorDetails}" th:text="${detail.currentTitle}"></li>
          <li th:each="detail : ${professorDetails}" th:text="${detail.degree}"></li>
          <li th:each="detail : ${professorDetails}" th:text="${detail.degreeTitle}"></li>

        </ul>
        <h5>Едукација:</h5>
        <ul>
          <li th:each="education : ${professorEducation}" th:text="${education.education.degree}"></li>
          <li th:each="education : ${professorEducation}" th:text="${education.education.institution}"></li>
          <li th:each="education : ${professorEducation}" th:text="${education.education.area}"></li>
          <li th:each="education : ${professorEducation}" th:text="${education.education.discipline}"></li>
          <li th:each="education : ${professorEducation}" th:text="${education.education.field}"></li>
          <li th:each="education : ${professorEducation}" th:text="${education.education.finishingYear}"></li>
        </ul>
        </p>
      </div>
    </div>
  </div>

</div>
</body>
</html>
