<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subject Details</title>
    <!-- Add Bootstrap CSS link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container">
    <h1>Subject List</h1>
    <table class="table table-bordered table-striped">
        <thead>
        <tr>
            <th>#</th>
            <th class="text-primary">kod</th>
            <th class="text-primary">ime na predmet</th>
            <th class="text-primary">programs</th>
            <th class="text-primary">vneseni soddrzini</th>
            <th class="text-primary">datum na promena</th>
            <th class="text-primary">zaklucen</th>
            <th></th>
        </tr>
        </thead>

        <tbody>
        <!-- Use Thymeleaf each loop to iterate through subjectDetailsList and add a row number -->
        <tr th:each="subjectDetail, rowStat : ${subjectDetailsList}">
            <td th:text="${rowStat.index + 1}">1</td>
            <td th:text="${subjectDetail.code}">Code</td>
            <td th:text="${subjectDetail.name}">Name</td>
            <td>
            <p>
                <th:block style="padding-right: 5px;" th:each="sp: ${subjectDetail.studyPrograms}">
                    <span th:text="${sp.studyProgram.code}"></span>,
                </th:block>
            </p>
            </td>
            <td th:text="${subjectDetail.numberOfContents}">Name</td>
            <td th:text="${subjectDetail.lastModified}">Name</td>
            <td>
                <input type="checkbox" th:checked="${subjectDetail.locked}" />
            </td>
            <td>
                <div class="btn-group-vertical" role="group">
                    <button type="button" class="btn btn-primary btn-sm mb-2">
                        <i class="fas fa-edit mr-1"></i> Edit
                    </button>
                    <button type="button" class="btn btn-danger btn-sm">
                        <i class="fas fa-trash-alt mr-1"></i> Delete
                    </button>
                </div>
            </td>


        </tr>
        </tbody>
    </table>
</div>

<!-- Add Bootstrap JavaScript and jQuery scripts (optional) -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
