<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}"
      xmlns:layout="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Room</title>
</head>
<body>

<div class="container mt-5" layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8 col-sm-12">
            <h1 class="text-center mb-4">Промена</h1>

            <form th:action="@{/admin/rooms/edit/{name} (name=${room.name})}" method="post" class="needs-validation" novalidate>
                <!-- Room Name -->
                <div class="mb-3">
                    <label for="newName" class="form-label">Име</label>
                    <input type="text" id="newName" name="newName" class="form-control" th:value="${room.name}" required>
                </div>

                <div class="mb-3">
                    <label for="locationDescription" class="form-label">Локација</label>
                    <input type="text" id="locationDescription" name="locationDescription" class="form-control" th:value="${room.locationDescription}" required>
                </div>

                <div class="mb-3">
                    <label for="equipmentDescription" class="form-label">Опрема</label>
                    <input type="text" id="equipmentDescription" name="equipmentDescription" class="form-control" th:value="${room.equipmentDescription}" required>
                </div>

                <div class="mb-3">
                    <label for="capacity" class="form-label">Број на Слушатели</label>
                    <input type="number" id="capacity" name="capacity" class="form-control" th:value="${room.capacity}" required>
                </div>

                <div class="mb-3">
                    <label for="type" class="form-label">Тип на соба</label>
                    <select id="type" name="type" class="form-select" th:value="${room.type}" required>
                        <option th:each="type : ${types}"
                                th:value="${type}"
                                th:text="${type}"
                                th:selected="${type == room.type}">Type</option>
                    </select>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">Зачувај</button>
                </div>
            </form>

        </div>
    </div>
</div>

</body>
</html>
