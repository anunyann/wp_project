<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title th:text="#{ADD_STUDY_PROGRAM_SUBJECT}"></title>
    <meta charset="UTF-8"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
</head>
<body class="bg-light">
<div class="view-content my-5" layout:fragment="content">
    <h2 th:text="#{ADD_STUDY_PROGRAM_SUBJECT}"></h2>
    <form th:action="@{'/admin/study-programs/' + ${studyProgramDetails?.id} + '/add-subject'}" method="post">
    <div class="mb-3">
            <label for="subject" class="form-label"><b th:text="#{SUBJECT}"></b></label>
            <select id="subject" name="subjectId" class="form-select">
                <option th:each="subject : ${subjects}" th:value="${subject.id}" th:text="${subject.getName()}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label for="mandatory" class="form-label bold-label"><b th:text="#{MANDATORY}"></b></label>
            <select id="mandatory" name="mandatory" class="form-select">
                <option value="true" th:text="#{MANDATORY}"></option>
                <option value="false" th:text="#{NON_MANDATORY}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label for="semester" class="form-label bold-label"><b th:text="#{SEMESTER}"></b></label>
            <select id="semester" name="semester" class="form-select">
                <option th:each="i : ${#numbers.sequence(1, 12)}" th:value="${i}" th:text="${i}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label for="order" class="form-label bold-label"><b>Order</b></label>
            <input type="number" id="order" name="order" class="form-control" placeholder="Enter order">
        </div>
        <button type="submit" class="btn btn-success" th:text="#{ADD}"></button>
    </form>

</div>
</body>
</html>
