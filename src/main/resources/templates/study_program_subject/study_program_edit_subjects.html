<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <meta charset="UTF-8"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
</head>
<body class="bg-light">
<div class="view-content my-5" layout:fragment="content">
    <h2 th:text="#{EDIT_STUDY_PROGRAM_SUBJECTS}"></h2>
    <span th:text="#{STUDY_PROGRAM} + ': ' + ${studyProgramDetails?.getStudyProgram()?.getName()}"></span>

    <div th:if="${error != null}" class="alert alert-danger" role="alert">
        <span th:text="${error}"></span>
    </div>

    <div th:if="${success != null}" class="alert alert-success" role="alert">
        <span th:text="${success}"></span>
    </div>

    <div class="container my-3">
        <a th:href="@{/admin/study-programs/{id}/add-subject(id=${studyProgramDetails.id})}" class="btn btn-success"
           th:text="#{ADD_STUDY_PROGRAM_SUBJECT}"></a>
    </div>

    <div class="container">
        <h3 th:text="#{MANDATORY_SUBJECTS}"></h3>
        <table class="table table-striped table-bordered">
            <thead>
            <tr>
                <th><b th:text="#{CODE}"></b></th>
                <th><b th:text="#{SUBJECT}"></b></th>
                <th><b th:text="#{MANDATORY}"></b></th>
                <th><b th:text="#{SEMESTER}"></b></th>
                <th><b>Action</b></th>
            </tr>
            </thead>
            <tbody>
            <form th:action="@{'/admin/study-programs/' + ${studyProgramDetails?.id} + '/edit-subjects'}" method="post"
                  th:each="subject : ${subjects}" th:if="${subject.mandatory}">
                <tr>
                    <td><span th:text="${subject.id}"></span></td>
                    <td>
                        <label>
                            <input type="text" name="name" th:value="${subject.subject.subject.getName()}" />
                        </label>
                    </td>
                    <td>
                        <label>
                            <select class="form-control" name="mandatory">
                                <option th:value="true" th:selected="${subject.getMandatory() == true}" th:text="#{MANDATORY}"></option>
                                <option th:value="false" th:selected="${subject.getMandatory() == false}" th:text="#{NON_MANDATORY}"></option>
                            </select>
                        </label>
                    </td>
                    <td>
                        <label>
                            <select class="form-control" name="semester">
                                <option th:if="${subject} != null"
                                        th:selected="${subject.getSemester() != null &&
                                        subject.getSemester() == i}"
                                        th:each="i : ${#numbers.sequence(1, 12)}"
                                        th:value="${i}"
                                        th:text="${i}">
                                </option>
                            </select>
                        </label>
                    </td>
                    <td>
                        <input type="hidden" name="subjectId" th:value="${subject.id}" />
                        <button type="submit" class="btn btn-primary" th:text="#{CHANGE}"></button>
                        <a th:href="@{'/admin/study-programs/' + ${studyProgramDetails?.id} + '/remove-subject/' + ${subject.id}}" class="btn btn-danger" th:text="#{DELETE}"></a>
                    </td>
                </tr>
            </form>
            </tbody>
        </table>

        <h3 th:text="#{NON_MANDATORY_SUBJECTS}"></h3>
        <table class="table table-striped table-bordered">
            <thead>
            <tr>
                <th><b th:text="#{CODE}"></b></th>
                <th><b th:text="#{SUBJECT}"></b></th>
                <th><b th:text="#{MANDATORY}"></b></th>
                <th><b th:text="#{SEMESTER}"></b></th>
                <th><b>Action</b></th>
            </tr>
            </thead>
            <tbody>
            <form th:action="@{'/admin/study-programs/' + ${studyProgramDetails?.id} + '/edit-subjects'}" method="post"
                  th:each="subject : ${subjects}" th:if="${!subject.mandatory}">
                <tr>
                    <td><span th:text="${subject.id}"></span></td>
                    <td>
                        <label>
                            <input type="text" name="name" th:value="${subject.subject.subject.getName()}" />
                        </label>
                    </td>
                    <td>
                        <label>
                            <select class="form-control" name="mandatory">
                                <option th:value="true" th:selected="${subject.getMandatory() == true}" th:text="#{MANDATORY}"></option>
                                <option th:value="false" th:selected="${subject.getMandatory() == false}" th:text="#{NON_MANDATORY}"></option>
                            </select>
                        </label>
                    </td>
                    <td>
                        <label>
                            <select class="form-control" name="semester">
                                <option th:if="${subject} != null"
                                        th:selected="${subject.getSemester() != null &&
                                        subject.getSemester() == i}"
                                        th:each="i : ${#numbers.sequence(1, 12)}"
                                        th:value="${i}"
                                        th:text="${i}">
                                </option>
                            </select>
                        </label>
                    </td>
                    <td>
                        <input type="hidden" name="subjectId" th:value="${subject.id}" />
                        <button type="submit" class="btn btn-primary" th:text="#{CHANGE}"></button>
                        <a th:href="@{'/admin/study-programs/' + ${studyProgramDetails?.id} + '/remove-subject/' + ${subject.id}}" class="btn btn-danger" th:text="#{DELETE}"></a>
                    </td>
                </tr>
            </form>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
