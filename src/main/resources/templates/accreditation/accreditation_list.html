<html lang="en" xmlns:th="http://www.thymeleaf.org">
<meta charset="utf-8"/>
<head>
    <meta charset="UTF-8"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
            crossorigin="anonymous"></script>
</head>
<body>
<h3 th:text="#{UNDERGRADUATE}"></h3>
<h4 th:text="#{ACCREDITATIONS}"></h4>
<div class="view-content">
    <div class="item-list">
        <table class="table table-striped table-bordered">
            <thead>
            <tr>
                <th class="text-primary" th:text="#{YEAR}"></th>
                <th class="text-primary" th:text="#{ACTIVE_FROM}"></th>
                <th class="text-primary" th:text="#{ACTIVE_TO}"></th>
                <th class="text-primary" th:text="#{IS_ACTIVE}"></th>
                <th class="text-primary" th:text="#{STUDY_PROGRAMS}"></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="acc : ${accreditations}">
                <td th:text="${acc.getYear()}"/>
                </td>
                <td th:text="${acc.getActiveFrom()}"></td>
                <td th:text="${acc.getActiveTo()}"></td>
                <td th:text="(${acc.getIsActive()} == true) ? Да : Не"></td>
                <td th:text="${acc.getStudyProgramFields()}"></td>
                <td class="text-right">
                    <div class="col-5">
                        <a th:href="@{'/admin/accreditations/edit-form/{id}' (id=${acc.getYear()})}"
                           class="btn btn-sm btn-info m-1">
                            <i class="fa fa-trash" th:text="#{EDIT}"></i>
                        </a>
                    </div>
                    <div class="col-5">
                        <a th:href="@{'/admin/accreditations/delete/{id}' (id=${acc.getYear()})}"
                           class="btn btn-sm btn-danger m-1">
                            <i class="fa fa-trash" th:text="#{DELETE}"></i>
                        </a>
                    </div>
                    <div class="col-5">
                        <a th:href="@{'/admin/accreditations/activate/{id}' (id=${acc.getYear()})}"
                           class="btn btn-sm btn-success m-1">
                            <i class="fa fa-trash" th:text="#{ACTIVATE}"></i>
                        </a>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <div class="col mb-3">
        <div class="row">
            <div class="col-sm-12 col-md-12 text-center">
                <a href="/accreditations/add-form" class="btn btn-block btn-primary" th:text="#{ADD_ACCREDITATION}"></a>
            </div>
        </div>
    </div>

</div>
</body>
</html>
