<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
            crossorigin="anonymous"></script>
</head>
<body>
<div class="container">
    <form action="/accreditations/add" method="POST">
        <label for="year" th:text="#{YEAR}"></label>
        <input type="text" id="year" class="form-control" name="year" required="required"
               th:value="(${accreditation} != null ? ${accreditation.getYear()} : '')"/>

        <label for="dateFrom" th:text="#{ACTIVE_FROM}"></label>
        <input type="date" id="dateFrom" class="form-control" name="activeFrom" required="required"
               th:value="(${accreditation} != null ? ${accreditation.getActiveFrom()} : '')"/>

        <label for="dateTo" th:text="#{ACTIVE_TO}"></label>
        <input type="date" id="dateTo" class="form-control" name="activeTo" required="required"
               th:value="(${accreditation} != null ? ${accreditation.getActiveTo()} : '')"/>

        <textarea class="form-control" name="studyProgramFields" hidden="true">;</textarea>

        <button type="submit" class="btn btn-primary col-12" th:text="#{SUBMIT}"></button>
    </form>
</div>
</body>
</html>
